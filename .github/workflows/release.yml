name: Package and release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Everything under Media/ is generated from art/, not committed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow soundfile
      - run: python tools/build_anims.py
      - run: python tools/build_sounds.py

      # The packager drops every file git does not track, so the generated
      # media has to be staged before it runs. This is never committed.
      - run: git add -f Media

      - uses: BigWigsMods/packager@v2
