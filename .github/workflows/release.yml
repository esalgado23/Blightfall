name: Package and release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Animation textures are generated from art/src, not committed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow && python tools/build_anims.py

      - uses: BigWigsMods/packager@v2
